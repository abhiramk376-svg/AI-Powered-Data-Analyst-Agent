[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Autonomous conversational Data Analyst Agent (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "redis>=5.0.8",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5.1",
    "httpx>=0.27.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.7",
]

[tool.uv]
package = false
